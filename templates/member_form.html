{% extends "base.html" %}
{% block title %}{{ "Edit" if member else "Add" }} member | Smart Library{% endblock %}
{% block content %}
<div class="form-card card shadow-sm"><div class="card-body p-4">
  <h1 class="h2">{{ "Edit member" if member else "Add a member" }}</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="full_name">Full name</label>
      <input class="form-control" id="full_name" name="full_name" required
             value="{{ member.full_name if member else '' }}"></div>
    <div class="mb-3"><label class="form-label" for="email">Email</label>
      <input class="form-control" id="email" name="email" type="email" required
             value="{{ member.email if member else '' }}"></div>
    <div class="mb-3"><label class="form-label" for="phone">Phone (optional)</label>
      <input class="form-control" id="phone" name="phone"
             value="{{ member.phone if member else '' }}"></div>
    <button class="btn btn-primary">Save member</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('catalog.members') }}">Cancel</a>
  </form>
</div></div>
{% endblock %}
